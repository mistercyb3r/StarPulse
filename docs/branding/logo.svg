  <!-- Wordmark: dominant-baseline middle aligns with icon center (cy=80) -->
  <text x="168" y="80" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#e7edf3">StarPulse</text>
