# Serves the built React app and reverse-proxies /api to the backend
# container (named "backend" in docker-compose.yml — update the
# proxy_pass target below if you rename that service).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The service worker and its manifest must always be revalidated —
    # long-lived caching here would strand users on a stale app version
    # after an upgrade (a classic PWA foot-gun).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Single-page app: let React Router / client-side routing handle
    # unknown paths instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
